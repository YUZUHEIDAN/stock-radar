<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stock Radar">
<title>Stock Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--card:#121821;--card2:#18202b;--line:#232d3a;--tx:#e8edf3;--mut:#8593a5;--up:#2fd18b;--dn:#ff5d6c;--amb:#f5b84a;--acc:#5aa9ff;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 84px)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:url(icon-512.png) center/cover;border:1px solid #1f5a40}
h1{font-size:19px;font-weight:700}
.sub{color:var(--mut);font-size:12px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:10px;border:1px solid}
.banner.bull{background:#0f2a1f;border-color:#1f5a40;color:#bff3da}
.banner.bear{background:#2b1418;border-color:#5a2530;color:#ffd0d5}
.banner.warn{background:#2a2210;border-color:#5a4718;color:#ffe3a8}
.banner.info{background:#101b2a;border-color:#22405f;color:#cfe4ff}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.st b{display:block;font-family:var(--mono);font-size:18px}
.st span{font-size:11px;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer}
.row:hover{border-color:#36465a}
.row.buy{box-shadow:inset 3px 0 0 var(--up)}
.row.sell{box-shadow:inset 3px 0 0 var(--dn)}
.row.hold{box-shadow:inset 3px 0 0 var(--acc)}
.tk{font-weight:700;font-size:16px;letter-spacing:.3px}
.nm{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.tag.g{color:var(--up);border-color:#1f5a40}.tag.r{color:var(--dn);border-color:#5a2530}.tag.a{color:var(--amb);border-color:#5a4718}.tag.b{color:var(--acc);border-color:#22405f}
.px{text-align:right}.px .p{font-family:var(--mono);font-size:15px}
.up{color:var(--up)}.dn{color:var(--dn)}
.sect{font-size:12px;color:var(--mut);margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b0f14ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;gap:2px;z-index:5}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:6px 14px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button.on{color:var(--tx);background:var(--card)}
nav svg{width:20px;height:20px}
nav i{position:absolute;top:2px;right:8px;background:var(--dn);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:0 5px;font-family:var(--mono)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{font-size:15px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--card2);border-radius:10px;padding:8px 10px}
.kv span{display:block;font-size:11px;color:var(--mut)}
.kv b{font-family:var(--mono);font-size:16px;font-weight:600}
.sheet{position:fixed;inset:0;background:#000a;z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--bg);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom) + 20px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:2px auto 10px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.x{background:var(--card);border:1px solid var(--line);color:var(--tx);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
canvas{width:100%;display:block}
.plan{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.plan div{border-radius:10px;padding:9px 11px;background:var(--card2);border-left:3px solid}
.plan span{font-size:11px;color:var(--mut);display:block}.plan b{font-family:var(--mono);font-size:15px}
.note{font-size:11.5px;color:var(--mut);line-height:1.55}
.act{font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:500;font-size:11.5px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-family:inherit}
td{padding:8px 4px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--line)}
ul.rules{padding-left:18px;font-size:13.5px;line-height:1.75}
.chip{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:99px;font-size:13px;text-decoration:none}
.empty{text-align:center;padding:26px 14px;color:var(--mut);font-size:13.5px}
.hide{display:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{background:none;border:0;color:var(--mut);font:inherit;font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo"></div><div><h1>Stock Radar</h1><div class="sub" id="asof">กำลังโหลด…</div></div></div>
    <div class="seg" id="seg"><button data-m="etf" class="on">ETF</button><button data-m="stk">หุ้น</button></div>
  </header>
  <section id="v-buy"></section>
  <section id="v-open" class="hide"></section>
  <section id="v-live" class="hide"></section>
  <section id="v-res" class="hide"></section>
</div>

<nav>
  <button data-v="buy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/></svg>สัญญาณ<i id="bBuy" class="hide"></i></button>
  <button data-v="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>ติดตาม<i id="bSell" class="hide"></i></button>
  <button data-v="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>ผลจริง</button>
  <button data-v="res"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>วิธีคิด</button>
</nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
let D,M='etf';
try{M=localStorage.getItem('sr_mode')||'etf'}catch(e){}
const X=()=>D[M];
const $=s=>document.querySelector(s);
const fmt=(x,d=2)=>x==null?'–':x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(x,d=1)=>x==null?'–':(x>=0?'+':'')+(x*100).toFixed(d)+'%';
const thd=iso=>new Date(iso+'T00:00:00Z').toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'UTC'});
const TAG={bb:'หลุด Bollinger ล่าง',rsi2:'RSI(2) < 5',vix:'VIX > 15'};
const WHY={above_sma5:'ปิดเหนือ SMA5',time:'ครบ 10 วัน',stop:'Stop',rsi2_70:'RSI(2) > 70'};
const ACT={buy_open:['g','ซื้อ'],buy_limit:['g','Buy limit'],sell_open:['r','ขาย'],sell_close:['r','ขาย'],hold:['b','ถือ']};
const BTM=()=>M==='etf'?X().bt:X().bt.bb;
const avg=a=>a.reduce((s,t)=>s+(t.ret||0),0)/(a.length||1);

function row(t,kind){
  const tags=t.tags.filter(k=>k!=='vix').map(k=>`<span class="tag">${TAG[k]}</span>`).join('');
  let right,cls,extra='';
  if(kind==='buy'){cls='buy';
    right=M==='etf'?`<div class="note">Buy limit</div><div class="p">$${fmt(t.limit)}</div><div class="note">ปิด $${fmt(t.sigClose)}</div>`:`<div class="p">$${fmt(t.sigClose)}</div><div class="num ${t.chg>=0?'up':'dn'}" style="font-size:12px">${pct(t.chg,2)}</div>`}
  else{const[a,l]=ACT[t.action]||['','']; cls=t.action.startsWith('sell')?'sell':'hold';
    right=`<div class="p ${t.ret>=0?'up':'dn'}">${pct(t.ret)}</div><div class="note">วันที่ ${t.day}/10</div>`;
    extra=`<span class="tag ${a}">${l}</span>`}
  return `<div class="row ${cls}" data-k="${t.key}"><div style="min-width:0"><div class="tk">${t.tk}</div><div class="nm">${t.name||''}${t.sector&&t.sector!=='ETF'?' · '+t.sector:''}</div><div class="tags">${extra}${tags}</div></div><div class="px">${right}</div></div>`;
}

function renderBuy(){
  const S=X(),T=S.today,bt=BTM();
  let top='';
  if(M==='etf'){
    const v=S.vix;
    top=`<div class="banner ${v>15?'bull':'warn'}"><span class="dot" style="background:${v>15?'var(--up)':'var(--amb)'}"></span><div>VIX ${fmt(v,1)} · ${v>15?'สัญญาณใช้งานได้ (ต้องการ VIX > 15)':'VIX ต่ำกว่า 15 → ระบบงดสัญญาณ (ช่วงนี้ในอดีต win แค่ ~50%)'}</div></div>
    <div class="banner info"><span class="dot" style="background:var(--acc)"></span><div><b>กติกา:</b> ตั้ง Buy limit ตามราคาที่ให้ ใช้ได้รอบถัดไปรอบเดียว · ขายที่ราคาเปิดหลัง RSI(2) ปิด &gt; 70 หรือครบ 10 วัน · Backtest: win ${(bt.win*100).toFixed(0)}% · เฉลี่ย ${pct(bt.avg,2)}/ไม้ · ~${bt.perYr} ไม้/ปี</div></div>`;
  } else {
    top=`${D.spy.aboveSma200?'':'<div class="banner warn"><span class="dot" style="background:var(--amb)"></span><div>SPY อยู่ใต้ SMA200 ระวังเป็นพิเศษ</div></div>'}
    <div class="banner warn"><span class="dot" style="background:var(--amb)"></span><div><b>โหมดทดลอง:</b> หุ้นรายตัวมี survivorship bias และไม้แย่สุดเคย ${pct(bt.worst,0)} · ใช้ ETF เป็นหลัก</div></div>
    <div class="banner info"><span class="dot" style="background:var(--acc)"></span><div><b>กติกา:</b> ซื้อที่ราคาเปิดรอบถัดไป · ขายเมื่อปิด &gt; SMA5 หรือครบ 10 วัน · Backtest: win ${(bt.win*100).toFixed(0)}% · เฉลี่ย ${pct(bt.avg,2)}/ไม้</div></div>`;
  }
  const watch=M==='etf'?`<div class="sect">ใกล้เข้าเงื่อนไข (ห่างจาก BB ล่าง)</div><div class="card" style="padding:6px 12px"><table>${S.watch.slice(0,6).map(w=>`<tr><td><b>${w.tk}</b> <span class="note">${w.name}</span></td><td>${w.up?'':'<span class="note">ใต้ SMA200</span> '}${pct(w.dist)}</td></tr>`).join('')}</table></div>`:'';
  $('#v-buy').innerHTML=`${top}
  <div class="sect">สัญญาณวันนี้ (${T.length})</div>
  <div class="list">${T.length?T.map(t=>row(t,'buy')).join(''):`<div class="card empty">วันนี้ไม่มีสัญญาณ<br>${M==='etf'?'เป็นเรื่องปกติ เฉลี่ยมีสัญญาณที่ได้ของแค่ ~2 ครั้ง/เดือน':'ช่วงตลาดขึ้นต่อเนื่องสัญญาณจะน้อย'}</div>`}</div>
  ${watch}
  <p class="note" style="margin-top:12px">⚠️ ไม่มี Stop loss ตามกติกา (ทดสอบแล้ว stop ทำให้ผลแย่ลง) ไม้แย่สุดในอดีต ${pct(bt.worst,0)} · ${M==='etf'?'แบ่งเงินเป็น 3–5 ช่อง ไม่ใช้ leverage · เงินว่างพักในกองทุนตลาดเงิน':'จำกัดเงินต่อไม้ไม่เกิน ~5% ของพอร์ต'}</p>`;
}
function renderOpen(){
  const O=X().open, sells=O.filter(t=>t.action.startsWith('sell'));
  $('#v-open').innerHTML=`
  <div class="stats"><div class="st"><b>${O.length}</b><span>เปิดอยู่</span></div><div class="st"><b class="dn">${sells.length}</b><span>ต้องขาย</span></div><div class="st"><b>${O.length-sells.length}</b><span>ถือต่อ</span></div><div class="st"><b class="${avg(O)>=0?'up':'dn'}">${O.length?pct(avg(O)):'–'}</b><span>เฉลี่ย</span></div></div>
  ${sells.length?`<div class="sect">ต้องขาย</div><div class="list">${sells.map(t=>row(t,'open')).join('')}</div>`:''}
  <div class="sect">ถือต่อ</div><div class="list">${O.filter(t=>t.action==='hold').map(t=>row(t,'open')).join('')||'<div class="card empty">ไม่มี</div>'}</div>
  <p class="note" style="margin-top:12px">ระบบติดตามทุกสัญญาณที่${M==='etf'?'ได้ของตามกติกา Buy limit':'เกิดขึ้น'}อัตโนมัติ ถ้าซื้อจริงแค่บางตัว ให้ดูเฉพาะตัวที่ถืออยู่</p>`;
}
function renderLive(){
  const f=X().fwd, C=X().recentClosed, bt=BTM();
  const tr=(l,a,b)=>`<tr><td>${l}</td><td>${a}</td><td>${b}</td></tr>`;
  $('#v-live').innerHTML=`
  <div class="card"><h3>ผลจริงล่วงหน้า (Paper trade) · ${M==='etf'?'ETF':'หุ้น'}</h3><p class="note">นับเฉพาะสัญญาณตั้งแต่ ${thd(f.started)} · ไม่มี bias · ควรมี ≥ ${M==='etf'?30:100} ไม้ก่อนเชื่อตัวเลข${M==='etf'?` · ไม่ได้ของ ${f.nofill} ครั้ง`:''}</p>
  <table style="margin-top:8px"><tr><th></th><th>ผลจริง</th><th>Backtest</th></tr>
  ${tr('จำนวนไม้',f.n,bt.n.toLocaleString())}${tr('Win rate',f.n?(f.win*100).toFixed(0)+'%':'–',(bt.win*100).toFixed(0)+'%')}
  ${tr('เฉลี่ย/ไม้',f.n?pct(f.avg,2):'–',pct(bt.avg,2))}${tr('Profit factor',f.n?(f.pf>=99?'∞':f.pf.toFixed(2)):'–',bt.pf.toFixed(2))}
  ${tr('แย่สุด',f.n?pct(f.worst):'–',pct(bt.worst,0))}</table>
  ${f.n<(M==='etf'?30:100)?`<div class="banner warn" style="margin-top:10px"><span class="dot" style="background:var(--amb)"></span><div>ยังเก็บได้ ${f.n}/${M==='etf'?30:100} ไม้ ตัวเลขยังเชื่อไม่ได้</div></div>`:''}</div>
  <div class="sect">ปิดสถานะล่าสุด</div>
  <div class="card" style="padding:6px 12px">${C.length?`<table><tr><th>ตัว</th><th>ซื้อ</th><th>ขาย</th><th>เหตุผล</th><th>ผล</th></tr>${C.map(t=>`<tr><td><b>${t.tk}</b></td><td>${thd(t.entryDate)}</td><td>${thd(t.exitDate)}</td><td style="font-family:inherit;font-size:12px">${WHY[t.why]||t.why}</td><td class="${t.ret>=0?'up':'dn'}">${pct(t.ret)}</td></tr>`).join('')}</table>`:'<div class="empty">ยังไม่มีไม้ที่ปิด</div>'}</div>`;
}
function renderRes(){
  const e=D.etf.bt,s=D.stk.bt;
  $('#v-res').innerHTML=`
  <div class="card"><h3>ETF Pullback (หลัก)</h3><ul class="rules">
   <li>ETF 18 ตัว: SPY QQQ IWM DIA MDY, Sector 9 ตัว, TLT GLD EFA EEM</li>
   <li>ราคา &gt; SMA200 · ราคาปิดหลุด Bollinger ล่าง (20,2) · VIX &gt; 15</li>
   <li><b>ซื้อ:</b> Buy limit = ราคาปิด − 0.5×ATR(14) ใช้ได้รอบถัดไปรอบเดียว</li>
   <li><b>ขาย:</b> RSI(2) ปิด &gt; 70 → ขายที่ราคาเปิดรอบถัดไป · หรือขายตอนปิดวันที่ 10</li>
   <li>แบ่งเงิน 3–5 ช่อง · ไม่ใช้ leverage · เงินว่างพักในกองทุนตลาดเงิน</li></ul>
  <table style="margin-top:8px"><tr><th></th><th>ไม้</th><th>Win</th><th>เฉลี่ย</th><th>PF</th></tr>
  <tr><td>Backtest ${e.from}–${e.to}</td><td>${e.n}</td><td>${(e.win*100).toFixed(0)}%</td><td>${pct(e.avg,2)}</td><td>${e.pf}</td></tr>
  <tr><td>ซื้อสุ่ม (เทียบ)</td><td>–</td><td>${(e.random_win*100).toFixed(0)}%</td><td>${pct(e.random_avg,2)}</td><td>–</td></tr></table>
  <p class="note" style="margin-top:8px">ไม่มี survivorship bias · ช่วงจูน 1994–2012 win 76% / ช่วงทดสอบ 2013–2026 win 77% · นับว่าได้ของเมื่อราคาทะลุ limit ลงไป ≥ 0.2% · หักค่าใช้จ่าย 0.1% · Buy limit ได้ของ ~${(e.fillRate*100).toFixed(0)}% ของสัญญาณ</p></div>
  <div class="card"><h3>คาดหวังอะไรได้บ้าง</h3><ul class="rules" style="font-size:13px">
   <li>Win สูง แต่สัญญาณน้อย เงินว่างเกือบตลอด → พอร์ตแบ่ง 5 ช่องโต ~2%/ปีจากการเทรด (+ ดอกเบี้ยเงินที่ว่าง)</li>
   <li>Drawdown ต่ำ (~−10 ถึง −15% ในอดีต) เทียบกับ SPY −55%</li>
   <li>ไม่ได้ทำให้พอร์ตโตเร็วกว่าถือดัชนี · เหมาะกับเงินก้อนเล็กที่อยากเทรดอย่างมีวินัย</li></ul></div>
  <div class="card"><h3>หุ้นรายตัว (ทดลอง)</h3><p class="note">S&P 500 · ราคา &gt; SMA200 · หลุด BB ล่าง หรือ RSI(2) &lt; 5 · ซื้อที่ราคาเปิด · ขายเมื่อปิด &gt; SMA5 หรือ 10 วัน · Backtest ${s.from}–${s.to}: win ${(s.bb.win*100).toFixed(0)}% · ${pct(s.bb.avg,2)}/ไม้ · แย่สุด ${pct(s.bb.worst,0)} · มี survivorship bias</p></div>
  <div class="card"><h3>ทดสอบแล้วไม่ผ่าน</h3><ul class="rules" style="font-size:13px">
   <li>MACD ทุก timeframe ≈ ซื้อสุ่ม · Breakout / Golden cross แย่กว่าสุ่ม</li>
   <li>Momentum 12-1: เท่า SPY เมื่อทดสอบแบบ point-in-time</li>
   <li>Turn-of-month: edge บาง · Stop loss: ทำให้ผลแย่ลง</li>
   <li>Day trade: ยังไม่ได้ทดสอบ (ต้องใช้ข้อมูล intraday แบบเสียเงิน)</li></ul></div>
  <div class="card"><p class="note">ข้อมูล EOD จาก Yahoo Finance (yfinance) อาจล่าช้า/ผิดพลาด · ผลในอดีตไม่รับประกันอนาคต · ไม่ใช่คำแนะนำการลงทุน</p></div>`;
}

function drawChart(cv,t){
  const ch=t.chart,n=ch.c.length,dpr=devicePixelRatio||1,W=cv.clientWidth,H=280;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';const g=cv.getContext('2d');g.scale(dpr,dpr);
  const pr=52,cw=(W-4-pr)/n,x=i=>4+cw*(i+.5);
  const vals=[...ch.l,...ch.h,...ch.bb_lo.filter(v=>v!=null),...ch.bb_hi.filter(v=>v!=null),...ch.sma200.filter(v=>v!=null)];
  if(t.limit)vals.push(t.limit);
  let lo=Math.min(...vals),hi=Math.max(...vals);const r=hi-lo;lo-=r*.03;hi+=r*.03;
  const y=v=>8+(hi-v)/(hi-lo)*(H-30);
  g.font='10px "JetBrains Mono",monospace';g.textBaseline='middle';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g.strokeStyle='#1a222d';g.beginPath();g.moveTo(4,y(v));g.lineTo(W-pr,y(v));g.stroke();g.fillStyle='#55626f';g.fillText(v.toFixed(v>100?0:1),W-pr+5,y(v))}
  g.fillStyle='#5aa9ff12';g.beginPath();ch.bb_hi.forEach((v,i)=>v!=null&&(i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v))));for(let i=n-1;i>=0;i--)ch.bb_lo[i]!=null&&g.lineTo(x(i),y(ch.bb_lo[i]));g.fill();
  const line=(a,c,w=1.3,dash)=>{g.strokeStyle=c;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();let s=0;a.forEach((v,i)=>{if(v==null)return;s++?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v))});g.stroke();g.setLineDash([])};
  line(ch.bb_lo,'#5aa9ff88',1,[3,3]);line(ch.bb_hi,'#5aa9ff88',1,[3,3]);
  for(let i=0;i<n;i++){const u=ch.c[i]>=ch.o[i];g.strokeStyle=g.fillStyle=u?'#2fd18b':'#ff5d6c';g.beginPath();g.moveTo(x(i),y(ch.h[i]));g.lineTo(x(i),y(ch.l[i]));g.stroke();const a=y(Math.max(ch.o[i],ch.c[i])),b=y(Math.min(ch.o[i],ch.c[i]));g.fillRect(x(i)-Math.max(1,cw*.32),a,Math.max(2,cw*.64),Math.max(1,b-a))}
  if(M==='stk')line(ch.sma5,'#f5b84a',1.4);line(ch.sma200,'#c08bff',1.4);
  const si=ch.d.indexOf(t.sigDate);if(si>=0){g.strokeStyle='#2fd18b';g.lineWidth=1.5;g.beginPath();g.arc(x(si),y(ch.l[si])+8,5,0,7);g.stroke()}
  const hl=(v,lab,col)=>{g.setLineDash([4,4]);g.strokeStyle=col;g.beginPath();g.moveTo(4,y(v));g.lineTo(W-pr,y(v));g.stroke();g.setLineDash([]);g.fillStyle=col;g.fillRect(W-pr+1,y(v)-8,pr-2,16);g.fillStyle='#0b0f14';g.fillText(lab,W-pr+5,y(v))};
  if(t.entry)hl(t.entry,'BUY','#e8edf3');else if(t.limit)hl(t.limit,'LIMIT','#2fd18b');
  g.fillStyle='#c08bff';g.fillText('SMA200',8,H-10);g.fillStyle='#5aa9ff';g.fillText('BB(20,2)',60,H-10);if(M==='stk'){g.fillStyle='#f5b84a';g.fillText('SMA5',124,H-10)}
}

function open_(key){
  const t=[...X().today,...X().open].find(x=>x.key===key);if(!t)return;
  const [a]=ACT[t.action]||['b'];
  const col={g:'#0f2a1f;color:#bff3da;border:1px solid #1f5a40',r:'#2b1418;color:#ffd0d5;border:1px solid #5a2530',b:'#101b2a;color:#cfe4ff;border:1px solid #22405f'}[a];
  const etf=M==='etf';
  const boxes=etf?`
   <div style="border-color:#2fd18b"><span>${t.entry?'ซื้อได้ที่ ('+thd(t.entryDate)+')':'Buy limit (รอบถัดไปเท่านั้น)'}</span><b>$${fmt(t.entry||t.limit)}</b></div>
   <div style="border-color:#e8edf3"><span>ราคาปิดวันสัญญาณ ${thd(t.sigDate)}</span><b>$${fmt(t.sigClose)}</b></div>
   <div style="border-color:#f5b84a"><span>ขายเมื่อ RSI(2) ปิด &gt; 70 · ตอนนี้</span><b>${fmt(t.rsi2,0)}</b></div>
   <div style="border-color:#5aa9ff"><span>${t.status==='open'?'ผลตอนนี้ · วันที่':'ถือสูงสุด'}</span><b>${t.status==='open'?pct(t.ret)+' · '+t.day+'/10':'10 วัน'}</b></div>`:`
   <div style="border-color:#2fd18b"><span>สัญญาณ ${thd(t.sigDate)}</span><b style="font-family:inherit;font-size:14px">${t.tags.map(k=>TAG[k]).join(' + ')}</b></div>
   <div style="border-color:#e8edf3"><span>${t.entry?'ซื้อที่ (เปิด '+thd(t.entryDate)+')':'ราคาปิดวันสัญญาณ'}</span><b>$${fmt(t.entry||t.sigClose)}</b></div>
   <div style="border-color:#f5b84a"><span>ขายเมื่อราคาปิดเหนือ SMA5</span><b>$${fmt(t.sma5)}</b></div>
   <div style="border-color:#5aa9ff"><span>${t.status==='open'?'ผลตอนนี้ · วันที่':'ถือสูงสุด'}</span><b>${t.status==='open'?pct(t.ret)+' · '+t.day+'/10':'10 วัน'}</b></div>`;
  const kv=etf?`<div><span>VIX วันสัญญาณ</span><b>${fmt(t.vix,1)}</b></div><div><span>ต่ำกว่า BB ล่าง</span><b>${pct(t.bbDepth)}</b></div><div><span>เหนือ SMA200</span><b>${pct(t.pctSma200)}</b></div>`
    :`<div><span>RSI(2)</span><b>${fmt(t.rsi2,1)}</b></div><div><span>ต่ำกว่า BB ล่าง</span><b>${pct(t.bbDepth)}</b></div><div><span>เหนือ SMA200</span><b>${pct(t.pctSma200)}</b></div>`;
  $('#panel').innerHTML=`<div class="grab"></div>
  <div class="dh"><div><div class="tk" style="font-size:22px" data-tk="${t.tk}">${t.tk}</div><div class="nm">${t.name||''}${t.sector&&t.sector!=='ETF'?' · '+t.sector:''}</div><div class="num" style="margin-top:2px">$${fmt(t.price)} <span class="${t.chg>=0?'up':'dn'}" style="font-size:13px">${pct(t.chg,2)}</span></div></div><button class="x" id="close">×</button></div>
  <div class="act" style="background:${col}">${t.actionText}</div>
  <div class="card" style="padding:10px 6px"><canvas id="cv"></canvas></div>
  <div class="plan">${boxes}</div>
  <div class="kv" style="margin-top:8px">${kv}</div>
  <p style="margin:12px 0"><a class="chip" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(t.tk.replace('-','.'))}" target="_blank" rel="noopener">เปิดกราฟใน TradingView ↗</a></p>
  <p class="note">${etf?'ถ้า Buy limit ไม่ได้ของในรอบถัดไป ให้ยกเลิกคำสั่ง ห้ามไล่ราคา · ':'SMA5 เปลี่ยนทุกวัน · '}ข้อมูลอัปเดตทุกเช้า · ไม่ใช่คำแนะนำการลงทุน</p>`;
  $('#sheet').classList.add('open');document.body.style.overflow='hidden';
  requestAnimationFrame(()=>drawChart($('#cv'),t));$('#close').onclick=close_;
}
function close_(){$('#sheet').classList.remove('open');document.body.style.overflow=''}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')close_()};
addEventListener('keydown',e=>{if(e.key==='Escape')close_()});
document.addEventListener('click',e=>{const r=e.target.closest('.row');if(r)open_(r.dataset.k)});
function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));['buy','open','live','res'].forEach(k=>$('#v-'+k).classList.toggle('hide',k!==v));scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function badges(){const s=X().open.filter(t=>t.action.startsWith('sell')).length,b=X().today.length;
  $('#bBuy').textContent=b;$('#bBuy').classList.toggle('hide',!b);$('#bBuy').style.background='var(--up)';
  $('#bSell').textContent=s;$('#bSell').classList.toggle('hide',!s)}
function render(){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===M));
  $('#asof').textContent=`${M==='etf'?'ETF '+X().scanned+' ตัว':'หุ้น '+X().scanned+' ตัว'} · ปิดตลาด ${thd(D.asOf)}`;
  badges();renderBuy();renderOpen();renderLive();renderRes()}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{M=b.dataset.m;try{localStorage.setItem('sr_mode',M)}catch(e){};if(D)render()});
fetch('data/latest.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  if(d.mode!=='v3')throw 0;D=d;
  if((Date.now()-new Date(D.generated))/36e5>80)document.querySelector('.app header').insertAdjacentHTML('afterend','<div class="banner warn"><span class="dot" style="background:var(--amb)"></span><div>ข้อมูลไม่ได้อัปเดตมากกว่า 3 วัน ลองเช็ก GitHub Actions</div></div>');
  render();
}).catch(()=>{$('#v-buy').innerHTML='<div class="card empty">ยังไม่มีข้อมูลเวอร์ชันใหม่ รอระบบสแกนรอบถัดไป</div>'});
</script>
