name: Research dataset
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: scan
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/research.py
      - run: |
          git config user.name "stock-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git diff --cached --quiet || git commit -m "research dataset $(date -u +%F)"
          git pull --rebase -q && git push
