name: Daily scan
on:
  schedule:
    - cron: '0 22 * * 1-5'   # 22:00 UTC Mon–Fri = 05:00 Bangkok Tue–Sat (after US close)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/run.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Commit results
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data scanner/universe.csv
          git diff --cached --quiet || git commit -m "scan $(date -u +%F)"
          git push
